[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vast-api-client"
version = "0.3.0"
description = "code to abstract working with vast data platform api"
authors = [{name="Chris Barnett", email="Christopher.Barnett@tufts.edu"}]
readme = "README.md"
# StrEnum and enum.verify, in models.py, are 3.11+
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.9.1",
]

[project.urls]
"Source Code" = "https://github.com/Tufts-Technology-Services/vast-api-client"

[dependency-groups]
dev = [
    "pytest>=8.3.1",
    "ruff>=0.11.4",
]

[tool.hatch.build.targets.wheel]
packages = ["vast_api_client"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
